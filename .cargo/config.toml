# Cargo build configuration.
#
# ── Faster Windows builds ─────────────────────────────────────────────────────
# On Windows-MSVC the *linker* (link.exe) dominates rebuild time, especially for
# the big `windows`/`webview2-com` crates and release LTO. Two levers:
#
#   1. Less debug info — done in the root Cargo.toml ([profile.dev] debug =
#      "line-tables-only"); applies everywhere, no setup.
#
#   2. Use LLD instead of MSVC link.exe — typically 2–5× faster linking. It needs
#      `lld-link.exe` on PATH: install LLVM (`winget install LLVM.LLVM`, or via
#      Visual Studio's "C++ Clang tools").
#
#      install-windows.ps1 AUTO-ENABLES it: if `lld-link.exe` is on PATH it sets
#      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link.exe for the build (and
#      falls back to link.exe otherwise). For `cargo tauri dev` / manual builds,
#      do the same once per shell:
#        $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = "lld-link.exe"
#
#   We DON'T hardcode the linker here (a static config would break the build for
#   anyone without LLVM) — the script's PATH check is the safe auto-enable.
#
# Other big wins (no file changes needed):
#   • Iterate with `cargo tauri dev` (dev profile + Vite HMR), NOT `cargo tauri
#     build` — the release profile uses fat LTO + codegen-units=1 (great binary,
#     slow build). Reserve release builds for shipping.
#   • `sccache` caches compiled crates across builds:
#       cargo install sccache  &&  set RUSTC_WRAPPER=sccache  (or $env: in PowerShell)
#   • Exclude the repo's `target\` from Windows Defender real-time scanning.
