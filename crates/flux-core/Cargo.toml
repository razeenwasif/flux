[package]
name = "flux-core"
description = "Flux daemon: window management, shared state, zero-copy IPC"
version.workspace = true
edition.workspace = true
license.workspace = true

# The binary is the app; the lib exists so integration tests / benches can
# exercise commands without spawning a window.
[lib]
name = "flux_core"
path = "src/lib.rs"

[[bin]]
name = "flux"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }  # `unstable` → multi-webview (one child webview per tab); `devtools` → F12 inspector in release
serde.workspace = true
serde_json.workspace = true
# TS type generation (BACKLOG #12): derive specta::Type on IPC structs and emit
# apps/shell/src/bindings.gen.ts so the hand-written ipc.ts mirror can't drift.
specta = { version = "1", features = ["serde", "typescript"] }
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot.workspace = true
dashmap.workspace = true
zeroize = "1"
# Remember the window size/position across launches (open as you left it).
tauri-plugin-window-state = "2"
# OS notifications for due reminders (Windows toast / Linux libnotify / macOS).
tauri-plugin-notification = "2"
# System + process memory readout, for memory-pressure tab eviction (#45).
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# Async waits between macro-replay steps (#67). `time` only; Tauri already pulls tokio.
tokio = { version = "1", features = ["time"] }
# E2E sync (#62): AES-256-GCM seal + Argon2id KDF over a bring-your-own folder.
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
# Favicons (#21): encode fetched icon bytes into a data: URL.
base64 = "0.22"
# Voice STT loads the native Vosk library at runtime so Windows builds do not
# need an MSVC import library (`libvosk.lib`) just to link Flux.
libloading = { version = "0.8", optional = true }
rusqlite = { version = "0.31", optional = true, features = ["bundled", "load_extension"] }
# Transcode ICO favicons → PNG so every engine (incl. WebKitGTK, which doesn't
# render data:image/x-icon in <img>) shows them. Just the ico+png codecs.
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

flux-agent.workspace = true
flux-embed.workspace = true
flux-filter.workspace = true
flux-import.workspace = true
flux-search.workspace = true
flux-vault.workspace = true

# OS secret store for the vault's data key (#61): Windows Credential Manager,
# macOS Keychain, Linux Secret Service (pure-rust zbus + crypto-rust, no C deps).
# Falls back to a file-backed key when no store is available (e.g. headless WSL).
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }

# Embedded terminal: real PTY (the wezterm crate). flux-term (WGPU renderer)
# remains the future native-render path; the PTY here feeds either renderer.
portable-pty = "0.8"

# Files tab: open a file with the OS default app (handles the Windows/macOS/
# Linux quirks correctly).
open = "5"
# Files tab — delete sends to the OS trash / recycle bin (recoverable), rather
# than an irreversible unlink. Cross-platform (freedesktop / Shell API). Its
# `os_limited` API also powers undo-of-trash (restore) on Windows/Linux.
trash = "5"
# Files tab — live directory watch (inotify / ReadDirectoryChangesW), so the
# listing reflects external changes without a manual refresh.
notify = "6"
# HTTP client for Rust-side fetches: the flux://omni dashboard (/stats, http)
# and the content-blocker filter lists (EasyList/EasyPrivacy, https → needs TLS).
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }

# Windows-only: DWM rounded corners (the window is opaque, so CSS can't round
# it). Cross-verified against the x86_64-pc-windows-msvc target.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Storage_FileSystem"] }
# Content-blocker request interceptor (#57/#91): WebView2's `WebResourceRequested`
# via the raw webview. Versions pinned to match wry/Tauri (webview2-com 0.38 +
# windows 0.61) so the COM types unify with `PlatformWebview::controller()`.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }

[dev-dependencies]
# Perf-budget benches (ADR 0001): ipc_roundtrip, dom_snapshot.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ipc"
harness = false

[features]
default = []
# Production asset serving (DO NOT REMOVE). Without this, even a release build
# loads the dev server URL (devUrl → localhost:1420) instead of the embedded
# frontend → ERR_CONNECTION_REFUSED. `cargo tauri build` sets it automatically;
# our install scripts pass `--features custom-protocol` to plain `cargo build`.
custom-protocol = ["tauri/custom-protocol"]
# Compile real llama.cpp inference. Off by default so `cargo check` stays
# fast and CI doesn't need CUDA/Metal toolchains; the MockBackend serves dev.
llama = ["flux-agent/llama"]
# Offline push-to-talk voice (STT) via Vosk. Off by default; when enabled, Flux
# loads native libvosk at runtime (Linux: libvosk.so; Windows: libvosk.dll).
voice = ["dep:libloading"]
# Prototype: cr-sqlite CRDT sync (SQLite changesets). Off by default — needs the
# native cr-sqlite loadable extension (third_party/crsqlite/crsqlite.{so,dll}).
crsync = ["dep:rusqlite"]
