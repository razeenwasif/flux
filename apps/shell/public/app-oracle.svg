<!-- Oracle Plant favicon — warm-paper tile with a filled botanical-green
     leaf and a paper-coloured central vein cut through it. Same tile
     shape as Nexus's favicon (rounded 6 px radius) so the two products
     read as portfolio siblings at the browser-tab level. Sister
     Oracles (Bird, Sea, Land) swap the central glyph and accent
     colour but keep the tile shape. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#FAF7F2"/>
  <path
    d="M 16 27 C 9 24 5 16 8 9 C 12 5 20 5 24 9 C 27 16 23 24 16 27 Z"
    fill="#3A5A3F"/>
  <path
    d="M 16 27 L 16 9"
    stroke="#FAF7F2"
    stroke-width="1.4"
    stroke-linecap="round"
    fill="none"/>
</svg>
