<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prism">
  <defs>
    <linearGradient id="prism-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B785F2"/>
      <stop offset="100%" stop-color="#5E1AA8"/>
    </linearGradient>
  </defs>

  <!-- Velvet rounded-square background so the icon stays legible on
       light browser tabs as well as dark ones. -->
  <rect width="32" height="32" rx="6" fill="#0A0A0F"/>

  <!-- The prism: an equilateral triangle filled with a royal-purple
       gradient and outlined in lavender for crispness at 16×16. -->
  <polygon
    points="16,5 27.5,26 4.5,26"
    fill="url(#prism-body)"
    stroke="#D7BFFF"
    stroke-width="1"
    stroke-linejoin="round"
  />

  <!-- A single white ray entering the left face — the input "white light". -->
  <line x1="0" y1="20" x2="10.5" y2="20" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Three dispersed rays exiting the right face: lavender → royal
       purple → gold. Classic prism = dispersion motif, in brand colours. -->
  <line x1="21" y1="18" x2="32" y2="13.5" stroke="#D7BFFF" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="21" y1="20" x2="32" y2="20"   stroke="#9747FF" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="21" y1="22" x2="32" y2="26.5" stroke="#D8B66F" stroke-width="1.1" stroke-linecap="round"/>
</svg>
