[package]
name = "flux-agent"
description = "Flux Agent: local LLM planning (llama.cpp/Gemma) compiled to structured DOM actions"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# TS type generation (BACKLOG #12) — wire types cross the IPC boundary.
specta = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Primary backend: HTTP to a local Ollama server. Blocking client (the planner
# runs on a blocking thread). Ollama itself is localhost and needs no TLS, but
# the opt-in Gemini backend (#175) talks to a public HTTPS endpoint — so `tls`
# is required here rather than inherited by chance from flux-core's copy through
# feature unification, which would break the moment this crate is built alone.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

# Alternative in-process backend (off by default): llama.cpp via FFI.
llama-cpp-2 = { version = "0.1", optional = true }

[features]
default = []
llama = ["dep:llama-cpp-2"]
