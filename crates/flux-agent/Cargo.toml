[package]
name = "flux-agent"
description = "Flux Agent: local LLM planning (llama.cpp/Gemma) compiled to structured DOM actions"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# TS type generation (BACKLOG #12) — wire types cross the IPC boundary.
specta = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Primary backend: HTTP to a local Ollama server. Blocking client (the planner
# runs on a blocking thread); http+json only — no TLS, Ollama is localhost.
ureq = { version = "2", default-features = false, features = ["json"] }

# Alternative in-process backend (off by default): llama.cpp via FFI.
llama-cpp-2 = { version = "0.1", optional = true }

[features]
default = []
llama = ["dep:llama-cpp-2"]
