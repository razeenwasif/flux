<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the chrome's own zoom (mobile): a stray pinch/double-tap must not
         enlarge the Flux UI. Web pages are separate WebViews with their own zoom. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Flux</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <!-- Theme, before first paint. Applying it from a Solid effect renders one
         frame in the default palette and then snaps, which reads as a bug on
         every single launch. Inline and tiny so it can't be the slow thing. -->
    <script>
      try {
        var t = localStorage.getItem("flux.theme");
        if (t && t !== "velvet") document.documentElement.setAttribute("data-theme", t);
        // The design too (design.ts), so its layout is the first frame.
        // Velvet Paper unless Classic was picked (DEFAULT_DESIGN in design.ts).
        // Its stylesheet is linked from <body> below, not here.
        var d = localStorage.getItem("flux.design") || "velvet-paper";
        var root = document.documentElement;
        // Liquid Silk is Velvet Paper's layout plus its own material (design.ts).
        if (d === "velvet-paper" || d === "liquid-silk") root.setAttribute("data-design", "velvet-paper");
        if (d === "liquid-silk") root.setAttribute("data-silk", "");
        // Silk's wallpaper and its options (wallpaper.ts).
        var w = localStorage.getItem("flux.wallpaper");
        root.setAttribute("data-wallpaper", /^(opal|abyss|ember|aurora)$/.test(w || "") ? w : "opal");
        if (localStorage.getItem("flux.wallpaper.accent") === "fixed") root.setAttribute("data-silk-accent", "fixed");
        if (localStorage.getItem("flux.wallpaper.still") === "1") root.setAttribute("data-silk-still", "");
        if (localStorage.getItem("flux.wallpaper.drift") === "1") root.setAttribute("data-silk-drift", "");
        if (localStorage.getItem("flux.window.acrylic") === "1") document.documentElement.classList.add("window-acrylic");
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- The design's stylesheet (design.ts). In <body> on purpose: the build
         injects the theme's stylesheet at the end of <head>, and the design has
         to come after it to win the rules they share. A stylesheet here still
         holds the paint of everything below it, so the first frame has it. -->
    <script>
      try {
        var dd = document.documentElement.getAttribute("data-design");
        if (dd)
          document.write('<link id="flux-design-css" rel="stylesheet" href="/designs/' + dd + '.css" />');
        if (document.documentElement.hasAttribute("data-silk"))
          document.write('<link id="flux-silk-css" rel="stylesheet" href="/designs/liquid-silk.css" />');
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
