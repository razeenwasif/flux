[package]
name = "flux-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Flux local password vault: AES-256-GCM at rest, OS-keychain key, importers (Proton Pass, …)"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# AEAD: AES-256-GCM seals the serialized vault; nonce is random per write.
aes-gcm = "0.10"
# Argon2id KDF: derives a key-encryption key from the master password to wrap
# the vault's data key (optional master-password protection).
argon2 = "0.5"
# CSPRNG for the data key + per-write nonces.
rand = "0.8"
# Wipe decrypted plaintext + secrets from memory on drop.
zeroize = "1"
# Proton Pass export formats: CSV, and ZIP (JSON/CSV inside). PGP-encrypted
# exports are decrypted with `pgp` (pure-rust) given the passphrase.
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
pgp = "0.14"
# NOTE: the OS-keychain data-key source (keyring crate: Windows Credential
# Manager / macOS Keychain / Linux Secret Service) is wired in the flux-core
# integration layer, where it's runtime-tested per platform. This crate stays
# pure + testable: callers pass the 32-byte key explicitly.
