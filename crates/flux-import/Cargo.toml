[package]
name = "flux-import"
description = "Importers for other browsers' data (Chrome bookmarks, tab groups, extension inventory)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# TS type generation (BACKLOG #12) — wire types cross the IPC boundary.
specta = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The Chromium family's sync store, for saved tab groups (tabgroups.rs).
rusty-leveldb = "4.0.2"
