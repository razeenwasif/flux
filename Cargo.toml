# ──────────────────────────────────────────────────────────────────────────────
# Flux — workspace root
#
# Layout:
#   crates/flux-core   → Tauri v2 daemon: window mgmt, state, zero-copy IPC
#   crates/flux-term   → WGPU-accelerated terminal emulator (Alacritty-style)
#   crates/flux-agent  → Local LLM bridge (llama.cpp / Gemma) + agentic DOM ops
#   crates/flux-embed  → Lightweight embeddings for semantic tab clustering
#   apps/shell         → SolidJS frontend (npm workspace, not a cargo member)
# ──────────────────────────────────────────────────────────────────────────────
[workspace]
resolver = "2"
members = [
    "crates/flux-core",
    "crates/tauri-plugin-flux-webview",
    "crates/flux-term",
    "crates/flux-agent",
    "crates/flux-embed",
    "crates/flux-import",
    "crates/flux-search",
    "crates/flux-filter",
    "crates/flux-vault",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flux-browser/flux"

# ── Lints ─────────────────────────────────────────────────────────────────────
# One shared baseline (each crate opts in with `[lints] workspace = true`):
# clippy's default (correctness/style/complexity/perf) at deny-by-warn — the
# codebase is warning-clean, so any new warning is new drift. Escapes are
# per-site `#[allow]` with a reason comment, never a blanket group toggle.
#
# NB: we deliberately do NOT enable `unsafe_op_in_unsafe_fn`. This is an
# edition-2021 workspace with large raw-FFI `unsafe fn`s (WebView2 COM on
# Windows, WebKitGTK `-sys` on Linux) where per-op `unsafe {}` blocks are pure
# noise — and it only lints on the platform target that's being compiled, so
# clippy on one OS can't keep it clean for the other.
[workspace.lints.clippy]
dbg_macro = "warn"          # committed dbg!() is always an accident
todo = "warn"               # committed todo!() panics in release
print_stdout = "warn"       # use tracing, not println (stdout is the CLI's)

[workspace.dependencies]
# Shared, version-pinned once so every crate agrees.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
parking_lot = "0.12"   # ~5x faster than std::sync::Mutex under contention, no poisoning
dashmap = "6"          # sharded concurrent map — lock-free reads on the tab table

# Internal crates, path-referenced.
flux-term = { path = "crates/flux-term" }
flux-agent = { path = "crates/flux-agent" }
flux-embed = { path = "crates/flux-embed" }
flux-import = { path = "crates/flux-import" }
flux-search = { path = "crates/flux-search" }
flux-filter = { path = "crates/flux-filter" }
flux-vault = { path = "crates/flux-vault" }

# ── Performance profiles ─────────────────────────────────────────────────────
# Release: maximum throughput, minimum binary size. LTO + 1 codegen unit costs
# build time but buys ~10-20% runtime and smaller .text — this is a browser,
# we ship it cold-started thousands of times a day.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"        # no unwinding tables → smaller binary, faster calls
strip = true

# Cold-path heavy crates — only touched on import (PGP/zip/csv export parsing)
# and occasional favicon transcode (image). Build them for size, not speed: this
# shrinks the binary without affecting the hot browsing/render path (which stays
# opt-level 3 above). Their runtime latency is irrelevant (one-shot operations).
[profile.release.package.pgp]
opt-level = "z"
[profile.release.package.image]
opt-level = "z"
[profile.release.package.zip]
opt-level = "z"
[profile.release.package.csv]
opt-level = "z"

# Fast iteration build (install-windows.ps1 -Fast / `cargo build --profile
# release-fast`). The shipping `release` above uses fat LTO + a single codegen unit
# for the smallest/fastest binary — which is exactly what makes a full build take
# minutes. This keeps a usable opt-level but skips whole-program LTO and runs codegen
# in parallel, cutting build time ~2× (esp. the relink). The exe is a bit larger and
# marginally slower — fine for testing features against the real (WebView2) binary.
[profile.release-fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16

# Dev: keep *our* code fast to compile, but optimize dependencies (wgpu, vte,
# llama bindings) so the dev-loop terminal still hits 120fps.
[profile.dev]
opt-level = 1
# Emit only line tables, not full debuginfo. Backtraces still have file:line, but
# the linker writes far less (esp. the MSVC `.pdb` on Windows) — a big cut to
# incremental link time, which dominates Windows dev rebuilds. See .cargo/config.toml
# for the optional LLD linker swap (the other half of the Windows speedup).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
